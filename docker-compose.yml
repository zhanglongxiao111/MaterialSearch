# MaterialSearch Server - Production Docker Compose
# Supabase 自托管 + MaterialSearch 服务

version: '3.8'

services:
  # ==========================================================================
  # Supabase Stack (最小化配置)
  # ==========================================================================
  
  postgres:
    image: supabase/postgres:15.1.0.147
    container_name: ms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      POSTGRES_DB: materialsearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong:
    image: kong:2.8
    container_name: ms-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      - "8000:8000"  # REST API
      - "8443:8443"  # HTTPS
    depends_on:
      - postgres

  auth:
    image: supabase/gotrue:v2.132.3
    container_name: ms-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-your-super-secret-password}@postgres:5432/materialsearch?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      postgres:
        condition: service_healthy

  rest:
    image: postgrest/postgrest:v11.2.2
    container_name: ms-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-your-super-secret-password}@postgres:5432/materialsearch
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # MaterialSearch 服务
  # ==========================================================================
  
  materialsearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-app
    restart: unless-stopped
    environment:
      # 数据库配置
      USE_SUPABASE: "true"
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.example}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token}
      JWT_EXPIRATION_HOURS: "24"
      
      # 服务配置
      HOST: "0.0.0.0"
      PORT: "5000"
      ENABLE_LOGIN: "true"
      
      # AI 模型配置
      MODEL_NAME: ${MODEL_NAME:-OFA-Sys/chinese-clip-vit-base-patch16}
      DEVICE: ${DEVICE:-auto}
      
      # 路径配置
      ASSETS_PATH: /data/assets
      TEMP_PATH: /data/tmp
    volumes:
      - ./instance:/app/instance
      - assets_data:/data/assets
      - tmp_data:/data/tmp
      - model_cache:/root/.cache/huggingface
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - auth
      - rest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==========================================================================
  # 可选: Nginx 反向代理
  # ==========================================================================
  
  nginx:
    image: nginx:alpine
    container_name: ms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - materialsearch
      - kong
    profiles:
      - production

volumes:
  postgres_data:
  assets_data:
  tmp_data:
  model_cache:

networks:
  default:
    name: materialsearch-network
